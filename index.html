<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b24">
<title>Mo Town</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b24; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; background: #6fbf5a; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

  /* ---- touch controls: only shown on phones and tablets ---- */
  .touch-ui { display: none; position: fixed; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
  body.touch.portrait { align-items: flex-start; }
  body.touch.portrait canvas { margin-top: env(safe-area-inset-top); border-radius: 0; }
  body.touch.playing .touch-ui.in-play, body.touch .touch-ui.always { display: flex; }
  #stick { left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; pointer-events: none;
           border: 3px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); box-sizing: border-box;
           align-items: center; justify-content: center; opacity: .55; }
  #stick.active { opacity: 1; }
  #knob { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #barkBtn { right: calc(22px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom));
             width: 104px; height: 104px; border-radius: 50%; pointer-events: none; align-items: center; justify-content: center;
             background: rgba(255,210,63,.9); border: 4px solid #151515; box-sizing: border-box; color: #151515;
             font-weight: 900; font-size: 22px; letter-spacing: .5px; box-shadow: 0 4px 0 #151515; transition: transform .08s; }
  #barkBtn.hit { transform: translateY(4px) scale(.94); box-shadow: 0 0 0 #151515; }
  #barkBtn.off { background: rgba(160,170,160,.6); }
  .mini { right: calc(22px + env(safe-area-inset-right)); bottom: calc(146px + env(safe-area-inset-bottom));
          width: 48px; height: 48px; border-radius: 50%; align-items: center; justify-content: center; padding: 0;
          background: rgba(22,30,26,.9); border: 2px solid rgba(255,255,255,.4); color: #fff; font-size: 13px; font-weight: 800; }
  #pauseBtn { right: calc(78px + env(safe-area-inset-right)); }
  #turnHint { left: 0; right: 0; justify-content: center; color: rgba(255,255,255,.6); font-size: 13px; font-weight: 700; }
  body.touch:not(.portrait) #turnHint { display: none; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<div id="stick" class="touch-ui in-play"><div id="knob"></div></div>
<div id="barkBtn" class="touch-ui in-play">WOOF</div>
<button id="muteBtn" class="touch-ui always mini" aria-label="Sound on or off"></button>
<button id="pauseBtn" class="touch-ui in-play mini" aria-label="Pause">II</button>
<div id="turnHint" class="touch-ui always">Turn your phone sideways for a bigger view</div>
<script>
'use strict';
/* ============================================================
   MO TOWN — a game about Mo the Bernese mountain dog.
   Eat cheese, chase pigeons, see off the postmen.
   Everything (art, sound, logic) lives in this one file.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 640;
const TOP = 140, BOTTOM = 540;          // the playable park sits between the two rows of houses
const FONT = "'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";

// ---------- tuning knobs (tweak these to rebalance) ----------
const CFG = {
  moSpeed: 205, turboSpeed: 430, queasySpeed: 105,
  gutMax: 5,                // cheeses needed to trigger the Turbo Trots
  turboTime: 6, queasyTime: 4,
  barkRadius: 145, barkCooldown: 0.9, stunTime: 2.3,
  maxLetters: 5,            // letters delivered before it's game over
  cheeseEvery: 2.4, maxCheese: 6,
  postmanStartGap: 4.2, postmanMinGap: 1.2,
  postmanStartSpeed: 52, postmanMaxSpeed: 98,
};

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// touch mode switches on for phones and tablets, or the first time a finger touches the screen
let touchMode = matchMedia('(pointer: coarse)').matches;
function fitCanvas() {
  const portrait = innerHeight > innerWidth;
  const s = Math.min(innerWidth / W, innerHeight / H) * (touchMode ? 1 : 0.97);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  document.body.classList.toggle('touch', touchMode);
  document.body.classList.toggle('portrait', touchMode && portrait);
  if (touchMode) {
    // in portrait the game sits at the top and the controls get the space underneath
    document.getElementById('turnHint').style.top = (Math.floor(H * s) + 14) + 'px';
    restStick();
  }
}
function restStick() {
  const el = document.getElementById('stick');
  el.style.left = '92px'; el.style.top = (innerHeight - 96) + 'px';
  el.classList.remove('active');
  document.getElementById('knob').style.transform = '';
}
addEventListener('resize', fitCanvas); addEventListener('orientationchange', () => setTimeout(fitCanvas, 200)); fitCanvas();

// ---------- houses & letterboxes ----------
const ROOFS = ['#c0503c', '#8a5a9e', '#3f7fae', '#d08a2e', '#5b8f4e'];
const WALLS = ['#f4e3c1', '#e9d6d6', '#dfe9ee', '#f6ecc9', '#e6dccb'];
const houses = [];
for (let row = 0; row < 2; row++) for (let i = 0; i < 5; i++) {
  houses.push({
    cx: 96 + i * 192, top: row === 0,
    roof: ROOFS[(i + row * 2) % 5], wall: WALLS[(i + row * 3) % 5],
    box: { x: 96 + i * 192 + 44, y: row === 0 ? TOP + 6 : BOTTOM - 6 },
    flash: 0,
  });
}

// ---------- sound (all synthesised in the browser, no audio files) ----------
let audio = null, master = null, noiseBuf = null, muted = false;

// Recorded sounds live in the sounds/ folder. Each one is optional: if a file is missing or
// cannot be loaded (for example when index.html is opened straight from disk in some browsers),
// the game quietly falls back to the synthesised version of that sound.
const CLIP_FILES = { bark: 'sounds/bark.mp3', farts: 'sounds/farts.mp3', scream: 'sounds/scream.mp3', powerup: 'sounds/powerup.mp3' };
// farts.mp3 holds six separate sounds; these are their [start, length] in seconds
const FARTS = [[0, 0.24], [0.53, 0.27], [1.08, 0.43], [1.87, 0.24], [2.4, 0.73], [3.72, 0.19]];
const BIG_FART = 4, LITTLE_FARTS = [0, 1, 2, 3, 5];
const clipData = {}, clips = {};
for (const [name, url] of Object.entries(CLIP_FILES)) {
  fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(data => { clipData[name] = data; decodeClips(); })
    .catch(() => { /* no file: the synth version is used instead */ });
}
function decodeClips() {
  if (!audio) return;                                  // decoding waits until the sound engine exists
  for (const name of Object.keys(clipData)) {
    const data = clipData[name]; delete clipData[name];
    audio.decodeAudioData(data, buf => { clips[name] = buf; }, () => { /* unreadable file: synth instead */ });
  }
}
// play a recorded clip (or a slice of one); returns false if it is not available
function clip(name, { offset = 0, dur = null, vol = 1, rate = 1, delay = 0 } = {}) {
  if (!audio || muted || !clips[name]) return false;
  const t = audio.currentTime + delay;
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = clips[name]; s.playbackRate.value = rate; g.gain.value = vol;
  s.connect(g).connect(master);
  if (dur) { s.start(t, offset, dur); g.gain.setValueAtTime(vol, t + dur / rate - 0.02); g.gain.linearRampToValueAtTime(0, t + dur / rate); }
  else s.start(t, offset);
  return true;
}
const fart = (i, opts = {}) => clip('farts', { offset: FARTS[i][0], dur: FARTS[i][1], ...opts });
let lastScream = -9;
function initAudio() {
  if (audio) { if (audio.state !== 'running') audio.resume(); return; }
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const comp = audio.createDynamicsCompressor();      // stops loud moments from crackling
    master = audio.createGain(); master.gain.value = muted ? 0 : 0.9;
    master.connect(comp).connect(audio.destination);
    noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (audio.state !== 'running') audio.resume();   // some browsers start the sound engine paused
    decodeClips();
  } catch (e) { audio = null; }
}
try { muted = localStorage.getItem('motown-muted') === '1'; } catch (e) { /* storage unavailable: fine */ }
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('motown-muted', muted ? '1' : '0'); } catch (e) { /* fine */ }
  initAudio();
  if (master) master.gain.value = muted ? 0 : 0.9;   // also cuts off anything still playing
  if (!muted) sfx.bark();                            // a woof to confirm the sound is back
}
// 'on', 'off' (muted by the player) or 'blocked' (the browser has not let sound start yet)
function soundStatus() {
  if (muted) return 'off';
  return audio && audio.state === 'running' ? 'on' : 'blocked';
}
// simple beep, used for the small arcade blips
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
// burst of filtered hiss: the breath in a bark, the splat in a poop
function noise(dur, freq, q, vol, delay = 0, type = 'bandpass', slideTo = null) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
// one big-dog "WOOF": a growly voice dropping in pitch, shaped by two mouth resonances
function woof(delay = 0, pitch = 1, vol = 1) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay, dur = 0.19;
  const o = audio.createOscillator(), o2 = audio.createOscillator(), env = audio.createGain();
  o.type = 'sawtooth'; o2.type = 'square';
  for (const [osc, mul] of [[o, 1], [o2, 0.5]]) {
    osc.frequency.setValueAtTime(150 * pitch * mul, t);
    osc.frequency.exponentialRampToValueAtTime(330 * pitch * mul, t + 0.03);
    osc.frequency.exponentialRampToValueAtTime(95 * pitch * mul, t + dur);
  }
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.55 * vol, t + 0.015);
  env.gain.setValueAtTime(0.5 * vol, t + 0.07);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  for (const [freq, q, gain] of [[520, 3, 1], [1150, 4, 0.55]]) {
    const f = audio.createBiquadFilter(), g = audio.createGain();
    f.type = 'bandpass'; f.Q.value = q; g.gain.value = gain;
    f.frequency.setValueAtTime(freq * 0.7, t);
    f.frequency.exponentialRampToValueAtTime(freq * 1.25, t + 0.04);   // mouth opening
    f.frequency.exponentialRampToValueAtTime(freq * 0.75, t + dur);    // and closing
    o.connect(f); o2.connect(f); f.connect(g).connect(env);
  }
  env.connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  noise(0.12, 900, 1.2, 0.22 * vol, delay);                            // the huff of air
}
// a rasp: low buzz chopped by a flappy wobble, with a wet splatter on top
function parp(dur, pitch = 80, vol = 0.5, delay = 0, endPitch = null, wet = 0.5) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator(), lp = audio.createBiquadFilter();
  const chop = audio.createGain(), lfo = audio.createOscillator(), depth = audio.createGain(), env = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(pitch, t);
  o.frequency.linearRampToValueAtTime(pitch * 1.25, t + dur * 0.3);
  o.frequency.exponentialRampToValueAtTime(endPitch || pitch * 0.6, t + dur);
  lp.type = 'lowpass'; lp.Q.value = 5;
  lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(260, t + dur);
  lfo.type = 'square';                                                 // the flap
  lfo.frequency.setValueAtTime(rand(26, 34), t);
  lfo.frequency.linearRampToValueAtTime(rand(11, 17), t + dur);        // slows as it runs out of puff
  chop.gain.value = 0.55; depth.gain.value = 0.45;
  lfo.connect(depth).connect(chop.gain);
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  env.gain.setValueAtTime(vol, t + dur * 0.7);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp).connect(chop).connect(env).connect(master);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
  if (wet) noise(dur * 0.9, 1400, 0.8, vol * wet * 0.5, delay, 'bandpass', 500);
}
const sfx = {
  bark()    { if (!clip('bark', { rate: rand(0.94, 1.07), vol: 0.9 })) { woof(0, rand(0.95, 1.05)); woof(0.21, rand(0.84, 0.92), 0.9); } },
  whimper() { tone(780, 0.16, 'sine', 0.07, 560); tone(700, 0.3, 'sine', 0.07, 400, 0.17); },
  cheese()  { tone(660, 0.07, 'square', 0.06); tone(880, 0.09, 'square', 0.06, null, 0.07); noise(0.07, 2400, 2, 0.07); },
  pigeon()  { for (let i = 0; i < 3; i++) noise(0.05, 2600, 3, 0.09, i * 0.055); tone(900, 0.06, 'triangle', 0.04, 1300); },
  // a thud, then the postman's scream (spaced out so a row of skittled posties is not deafening)
  bowl() {
    noise(0.16, 260, 1, 0.5, 0, 'lowpass'); tone(180, 0.25, 'square', 0.09, 60);
    const now = audio ? audio.currentTime : 0;
    if (now - lastScream > 0.3 && clip('scream', { offset: 0.09, rate: rand(0.92, 1.15), vol: 0.9 })) lastScream = now;
    else if (!clips.scream) tone(520, 0.12, 'triangle', 0.06, 1000, 0.05);
  },
  thwack()  { noise(0.09, 1800, 1.5, 0.4); tone(120, 0.18, 'sawtooth', 0.12, 50); },
  letter()  { tone(330, 0.18, 'triangle', 0.09, 220); tone(220, 0.3, 'triangle', 0.09, 150, 0.18); },
  // the main event: a tummy gurgle, then an almighty eruption, a rising whistle and a few aftershocks
  trots() {
    const jingle = clip('powerup', { vol: 1.7 });
    if (fart(BIG_FART, { delay: 0.12, vol: 1 })) { fart(2, { delay: 0.95, vol: 0.8 }); return; }
    if (jingle) { parp(1.15, 105, 0.75, 0.12, 42, 0.9); return; }
    tone(90, 0.28, 'sine', 0.3, 170); tone(150, 0.2, 'sine', 0.2, 80, 0.12);
    parp(1.15, 105, 0.75, 0.3, 42, 0.9);
    noise(0.5, 300, 0.7, 0.45, 0.3, 'lowpass', 90);
    tone(240, 0.8, 'square', 0.035, 1200, 0.4);
    parp(0.22, 130, 0.5, 1.5, 85, 0.7); parp(0.16, 150, 0.4, 1.78, 100, 0.6);
  },
  // little squits that keep coming while the turbo lasts
  squit()   { if (!fart(pick(LITTLE_FARTS), { rate: rand(0.85, 1.25), vol: rand(0.55, 0.8) })) parp(rand(0.09, 0.2), rand(80, 150), rand(0.22, 0.36), 0, null, rand(0.5, 1)); },
  // the last sad deflating toot as the turbo runs out
  queasy()  { if (!fart(2, { rate: 0.62, vol: 0.8 })) parp(0.75, 120, 0.4, 0, 38, 0.3); tone(260, 0.5, 'sine', 0.06, 110, 0.5); },
  over()    { tone(392, 0.2, 'triangle', 0.1); tone(330, 0.2, 'triangle', 0.1, null, 0.22); tone(262, 0.5, 'triangle', 0.1, null, 0.44); woof(0.95, 0.7, 0.7); },
};

// ---------- input ----------
const keys = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  initAudio();
  keys.add(k);
  if (k === 'm') { toggleMute(); return; }
  if (G.mode === 'title' && (k === 'enter' || k === ' ')) { startGame(); return; }
  if (G.mode === 'over' && (k === 'enter' || k === ' ') && G.overT > 0.8) { startGame(); return; }
  if (G.mode === 'play' && k === 'p') G.paused = !G.paused;
  if (G.mode === 'play' && !G.paused && k === ' ') bark();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

// the speaker button in the bottom-right corner; a click anywhere also wakes the sound engine
const SOUND_BTN = { x: W - 176, y: H - 40, w: 164, h: 30 };
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const onSoundBtn = pt => pt.x >= SOUND_BTN.x && pt.x <= SOUND_BTN.x + SOUND_BTN.w && pt.y >= SOUND_BTN.y && pt.y <= SOUND_BTN.y + SOUND_BTN.h;
// ---- touch: drag anywhere on the left half to run, tap anywhere on the right half to bark ----
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };      // x and y run from -1 to 1
const JOY_RADIUS = 48, JOY_DEAD = 0.18;
function moveJoy(e) {
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_RADIUS) {                                   // let the stick follow a thumb that drifts
    joy.ox += dx * (1 - JOY_RADIUS / d); joy.oy += dy * (1 - JOY_RADIUS / d);
    dx = e.clientX - joy.ox; dy = e.clientY - joy.oy;
  }
  joy.x = dx / JOY_RADIUS; joy.y = dy / JOY_RADIUS;
  const el = document.getElementById('stick');
  el.style.left = joy.ox + 'px'; el.style.top = joy.oy + 'px'; el.classList.add('active');
  document.getElementById('knob').style.transform = `translate(${dx}px, ${dy}px)`;
}
function endJoy(e) {
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.x = joy.y = 0; restStick();
}
addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveJoy(e); });
addEventListener('pointerup', endJoy); addEventListener('pointercancel', endJoy);
addEventListener('contextmenu', e => e.preventDefault());
// phones only let sound start from a finished tap, so wake the sound engine on these too
addEventListener('touchend', initAudio); addEventListener('click', initAudio);

addEventListener('pointerdown', e => {
  const wasBlocked = soundStatus() === 'blocked';
  initAudio();
  if (e.pointerType !== 'mouse' && !touchMode) { touchMode = true; fitCanvas(); }
  const pt = canvasPoint(e);
  if (!touchMode && onSoundBtn(pt)) { if (wasBlocked) woof(0.05, 1, 0.8); else toggleMute(); return; }
  if (G.mode === 'title' || (G.mode === 'over' && G.overT > 0.8)) { startGame(); return; }
  if (G.mode !== 'play') return;
  if (G.paused) { G.paused = false; return; }
  if (e.pointerType === 'mouse') return;
  if (e.clientX < innerWidth / 2) {
    if (joy.id === null) { joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; moveJoy(e); }
  } else {
    bark();
    const b = document.getElementById('barkBtn');
    b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 110);
  }
});
for (const [id, action] of [['muteBtn', () => toggleMute()], ['pauseBtn', () => { if (G.mode === 'play') G.paused = !G.paused; }]]) {
  document.getElementById(id).addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); initAudio(); action(); });
}
// pause automatically if the player switches app or the phone locks
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') { G.paused = true; keys.clear(); joy.id = null; joy.x = joy.y = 0; } });
canvas.addEventListener('pointermove', e => { canvas.style.cursor = onSoundBtn(canvasPoint(e)) ? 'pointer' : 'default'; });
addEventListener('blur', () => keys.clear());

// ---------- game state ----------
let best = 0;
try { best = Number(localStorage.getItem('motown-best')) || 0; } catch (e) { /* storage unavailable: fine */ }

const G = { mode: 'title', t: 0 };
window.G = G; // handy for poking at the game from the browser console

function startGame() {
  Object.assign(G, {
    mode: 'play', paused: false, t: 0, score: 0, letters: 0, overT: 0, shake: 0,
    mo: { x: W / 2, y: (TOP + BOTTOM) / 2, dir: 1, phase: 0, moving: false,
          gut: 0, state: 'normal', stateT: 0, barkCd: 0, dazed: 0, immune: 0, trailT: 0 },
    postmen: [], pigeons: [], cheeses: [], puddles: [], particles: [], popups: [], rings: [], flocks: {},
    cheeseT: 1, postT: 2.5, flockT: 4, flockId: 0,
    stats: { bowled: 0, chased: 0, cheese: 0, trots: 0 },
  });
  for (let i = 0; i < 3; i++) spawnCheese();
}

// ---------- spawning ----------
function spawnCheese() {
  if (G.cheeses.length >= CFG.maxCheese) return;
  G.cheeses.push({ x: rand(60, W - 60), y: rand(TOP + 50, BOTTOM - 50), hp: 5, bob: rand(0, 6), born: G.t });
}
function spawnPostman() {
  const fromLeft = Math.random() < 0.5;
  const house = pick(houses);
  const level = Math.min(1, G.t / 150);
  G.postmen.push({
    x: fromLeft ? -30 : W + 30, y: rand(TOP + 40, BOTTOM - 40),
    tx: house.box.x, ty: house.box.y + (house.top ? 14 : -14), house,
    speed: CFG.postmanStartSpeed + (CFG.postmanMaxSpeed - CFG.postmanStartSpeed) * level + rand(-6, 6),
    state: 'walk', t: 0, phase: rand(0, 6), dir: fromLeft ? 1 : -1, vx: 0, vy: 0, rot: 0, hasLetter: true,
  });
}
function spawnFlock() {
  if (G.pigeons.length > 12) return;
  const target = G.cheeses.length && Math.random() < 0.65 ? pick(G.cheeses) : null;
  const cx = target ? target.x : rand(90, W - 90), cy = target ? target.y : rand(TOP + 60, BOTTOM - 60);
  const id = ++G.flockId, n = randi(3, 6);
  G.flocks[id] = { n, chased: 0, first: 0, done: false };
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), r = rand(8, 34);
    const gx = clamp(cx + Math.cos(a) * r, 30, W - 30), gy = clamp(cy + Math.sin(a) * r, TOP + 20, BOTTOM - 20);
    G.pigeons.push({ x: gx + rand(-200, 200), y: gy - 60, gx, gy, z: 260 + i * 30, state: 'land',
                     t: 0, alertT: 0, vx: 0, vy: 0, dir: pick([-1, 1]), bob: rand(0, 6), flock: id });
  }
}

// ---------- effects ----------
function popup(x, y, text, colour = '#fff', size = 18) {
  // nudge upwards so popups that land together stack instead of overlapping
  for (const u of G.popups) if (u.t < 0.5 && Math.abs(u.x - x) < 110 && Math.abs(u.y - y) < 20) y = u.y - 22;
  G.popups.push({ x, y, text, colour, size, t: 0 });
}
function burst(x, y, n, colours, speed = 160, life = 0.7, kind = 'dot') {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(speed * 0.3, speed);
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life,
                       colour: pick(colours), size: rand(2, 5), kind, rot: rand(0, 6), spin: rand(-8, 8) });
  }
}
function addScore(n, x, y, label, colour) {
  const mult = G.mo.state === 'turbo' ? 2 : 1;
  G.score += n * mult;
  popup(x, y, (label ? label + ' ' : '') + '+' + n * mult, colour || (mult > 1 ? '#ffd23f' : '#fff'), mult > 1 ? 22 : 18);
}

// ---------- Mo's actions ----------
function bark() {
  const mo = G.mo;
  if (mo.barkCd > 0 || mo.dazed > 0) return;
  if (mo.state === 'queasy') { mo.barkCd = 0.6; sfx.whimper(); popup(mo.x, mo.y - 46, '*whimper*', '#cfe8b0', 15); return; }
  mo.barkCd = CFG.barkCooldown;
  sfx.bark();
  G.rings.push({ x: mo.x, y: mo.y, t: 0 });
  popup(mo.x + mo.dir * 30, mo.y - 50, 'WOOF!', '#fff', 24);
  for (const p of G.postmen) {
    if ((p.state === 'walk' || p.state === 'leave' || p.state === 'stun') && dist(p, mo) < CFG.barkRadius) stun(p, CFG.stunTime);
  }
  for (const b of G.pigeons) {
    if (b.state === 'peck' || b.state === 'alert') { if (dist(b, mo) < CFG.barkRadius + 30) takeOff(b, true); }
  }
}
function stun(p, time) {
  if (p.state === 'bowled') return;
  if (p.state !== 'stun') p.resume = p.state;
  p.state = 'stun'; p.t = time;
}
function bowlOver(p, fromX, fromY, label) {
  if (p.state === 'bowled') return;
  const a = Math.atan2(p.y - fromY, p.x - fromX);
  p.state = 'bowled'; p.t = 1.3;
  p.vx = Math.cos(a) * 420; p.vy = Math.sin(a) * 420 - 60; p.spin = rand(-14, 14);
  G.stats.bowled++;
  G.shake = Math.max(G.shake, 6);
  sfx.bowl();
  burst(p.x, p.y, 7, ['#fff', '#f3e9d2', '#c9a26b'], 240, 1.1, 'letter');
  addScore(100, p.x, p.y - 30, label || 'Postie down!');
}
function takeOff(b, byMo) {
  if (b.state === 'fly') return;
  const mo = G.mo;
  const a = Math.atan2(b.y - mo.y, b.x - mo.x) + rand(-0.5, 0.5);
  b.state = 'fly'; b.vx = Math.cos(a) * 270; b.vy = Math.sin(a) * 270 - 40; b.dir = b.vx < 0 ? -1 : 1;
  burst(b.x, b.y, 3, ['#cfd5e2', '#fff'], 90, 0.8, 'feather');
  // a faceful of pigeon stuns any postman standing too close
  for (const p of G.postmen) {
    if ((p.state === 'walk' || p.state === 'leave') && dist(p, b) < 62) { stun(p, 1.8); popup(p.x, p.y - 44, "Pigeon'd!", '#cfd5e2', 15); }
  }
  if (!byMo) return;
  sfx.pigeon();
  G.stats.chased++;
  addScore(10, b.x, b.y - 18, '', '#e8ecf5');
  const f = G.flocks[b.flock];
  if (f && !f.done) {
    if (!f.chased) f.first = G.t;
    f.chased++;
    if (f.chased >= f.n) {
      f.done = true;
      if (G.t - f.first < 3.5) addScore(50, b.x, b.y - 44, 'Whole flock!', '#9be7ff');
    }
  }
}
function startTrots() {
  const mo = G.mo;
  mo.state = 'turbo'; mo.stateT = CFG.turboTime; mo.gut = 0; mo.dazed = 0; mo.squitT = 1.5;
  G.stats.trots++; G.shake = 12;
  sfx.trots();
  popup(mo.x, mo.y - 70, 'TURBO TROTS!', '#ffd23f', 34);
  burst(mo.x, mo.y, 26, ['#7a4a1e', '#5c3713', '#a0682e'], 320, 0.9);
}

// ---------- update ----------
function update(dt) {
  G.t += dt;
  const mo = G.mo;

  // --- Mo movement ---
  let dx = 0, dy = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx -= 1;
  if (keys.has('arrowright') || keys.has('d')) dx += 1;
  if (keys.has('arrowup') || keys.has('w')) dy -= 1;
  if (keys.has('arrowdown') || keys.has('s')) dy += 1;
  mo.barkCd -= dt; mo.immune -= dt;
  if (mo.dazed > 0) { mo.dazed -= dt; dx = dy = 0; mo.x += mo.kx * dt; mo.y += mo.ky * dt; mo.kx *= 0.9; mo.ky *= 0.9; }
  const speed = mo.state === 'turbo' ? CFG.turboSpeed : mo.state === 'queasy' ? CFG.queasySpeed : CFG.moSpeed;
  if (joy.id !== null && mo.dazed <= 0 && Math.hypot(joy.x, joy.y) > JOY_DEAD) { dx = joy.x; dy = joy.y; }
  const len = Math.hypot(dx, dy);
  mo.moving = len > 0;
  if (len) {
    const push = Math.min(1, len);                        // a gentle push on the stick walks, a full push runs
    mo.x += dx / len * speed * push * dt; mo.y += dy / len * speed * push * dt;
    if (Math.abs(dx) > 0.15) mo.dir = dx > 0 ? 1 : -1;
    mo.phase += dt * (mo.state === 'turbo' ? 26 : mo.state === 'queasy' ? 7 : 14);
  }
  mo.x = clamp(mo.x, 34, W - 34); mo.y = clamp(mo.y, TOP + 22, BOTTOM - 24);

  // --- Mo's digestive journey ---
  if (mo.state === 'turbo') {
    mo.stateT -= dt; mo.trailT -= dt;
    mo.squitT -= dt;
    if (mo.squitT <= 0) { mo.squitT = rand(0.16, 0.42); sfx.squit(); }
    if (mo.trailT <= 0) {
      mo.trailT = 0.05;
      G.puddles.push({ x: mo.x - mo.dir * 26 + rand(-5, 5), y: mo.y + 16 + rand(-5, 5), life: 5, r: rand(9, 15) });
      if (G.puddles.length > 160) G.puddles.shift();
      burst(mo.x - mo.dir * 30, mo.y + 6, 1, ['#7a4a1e', '#a0682e', '#d9c9a8'], 120, 0.5);
    }
    if (mo.stateT <= 0) {
      mo.state = 'queasy'; mo.stateT = CFG.queasyTime; sfx.queasy();
      popup(mo.x, mo.y - 56, 'Oooh, me tummy...', '#cfe8b0', 20);
    }
  } else if (mo.state === 'queasy') {
    mo.stateT -= dt;
    if (mo.stateT <= 0) { mo.state = 'normal'; popup(mo.x, mo.y - 50, 'Right as rain!', '#fff', 18); }
  }

  // --- cheese ---
  G.cheeseT -= dt;
  if (G.cheeseT <= 0) { G.cheeseT = CFG.cheeseEvery + rand(-0.6, 0.8); spawnCheese(); }
  for (const c of G.cheeses) {
    if (mo.state !== 'queasy' && dist(c, mo) < 34) {
      c.hp = 0; c.eaten = true;
      G.stats.cheese++; sfx.cheese();
      burst(c.x, c.y, 8, ['#ffd23f', '#ffe98a', '#f5b700'], 150, 0.5);
      addScore(10, c.x, c.y - 20, '', '#ffe98a');
      if (mo.state === 'normal' && ++mo.gut >= CFG.gutMax) startTrots();
    }
  }
  G.cheeses = G.cheeses.filter(c => c.hp > 0);

  // --- postmen ---
  G.postT -= dt;
  if (G.postT <= 0) {
    const level = Math.min(1, G.t / 150);
    G.postT = CFG.postmanStartGap - (CFG.postmanStartGap - CFG.postmanMinGap) * level + rand(-0.4, 0.4);
    spawnPostman();
  }
  for (const p of G.postmen) {
    p.t -= dt;
    if (p.state === 'walk' || p.state === 'leave') {
      const d = Math.hypot(p.tx - p.x, p.ty - p.y);
      if (d < 5) {
        if (p.state === 'walk') deliver(p); else p.gone = true;
      } else {
        const s = p.state === 'leave' ? p.speed * 1.3 : p.speed;
        p.x += (p.tx - p.x) / d * s * dt; p.y += (p.ty - p.y) / d * s * dt;
        if (Math.abs(p.tx - p.x) > 4) p.dir = p.tx > p.x ? 1 : -1;
        p.phase += dt * 9;
      }
      // slipping on Mo's trail
      for (const q of G.puddles) if (Math.hypot(q.x - p.x, q.y - (p.y + 14)) < q.r + 8) { bowlOver(p, q.x - p.dir * 10, q.y + 20, 'Slipped!'); break; }
    } else if (p.state === 'stun') {
      if (p.t <= 0) p.state = p.resume || 'walk';
    } else if (p.state === 'bowled') {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.rot += p.spin * dt;
      if (p.t <= 0) p.gone = true;
    }
    // bumping into Mo
    if (p.state !== 'bowled' && dist(p, mo) < 36) {
      if (mo.state === 'turbo') bowlOver(p, mo.x, mo.y, 'Skittled!');
      else if (p.state === 'stun') bowlOver(p, mo.x, mo.y);
      else if (mo.immune <= 0 && mo.dazed <= 0) {
        const a = Math.atan2(mo.y - p.y, mo.x - p.x);
        mo.dazed = 0.6; mo.immune = 1.4; mo.kx = Math.cos(a) * 320; mo.ky = Math.sin(a) * 320;
        G.shake = 5; sfx.thwack();
        popup(mo.x, mo.y - 46, 'Thwack! Bark first!', '#ff8f8f', 17);
        burst(mo.x, mo.y - 10, 6, ['#fff', '#ffd23f'], 140, 0.4, 'star');
      }
    }
  }
  G.postmen = G.postmen.filter(p => !p.gone);

  // --- pigeons ---
  G.flockT -= dt;
  if (G.flockT <= 0) { G.flockT = rand(5, 8.5); spawnFlock(); }
  for (const b of G.pigeons) {
    b.bob += dt * 9;
    if (b.state === 'land') {
      b.x += (b.gx - b.x) * Math.min(1, dt * 2.6); b.y += (b.gy - b.y) * Math.min(1, dt * 2.6);
      b.z = Math.max(0, b.z - 190 * dt);
      if (b.z <= 0) { b.state = 'peck'; b.x = b.gx; b.y = b.gy; }
    } else if (b.state === 'peck' || b.state === 'alert') {
      const d = dist(b, mo);
      if (d < 26) { burst(b.x, b.y, 6, ['#cfd5e2', '#fff'], 150, 0.9, 'feather'); addScore(20, b.x, b.y - 34, 'So close!', '#9be7ff'); takeOff(b, true); continue; }
      if (b.state === 'peck') {
        if (d < 108) { b.state = 'alert'; b.alertT = rand(0.22, 0.6); }
        // pigeons scoff any cheese they are standing next to
        for (const c of G.cheeses) if (Math.hypot(c.x - b.x, c.y - b.y) < 40) {
          c.hp -= dt * 0.28;
          if (c.hp <= 0 && !c.eaten) { popup(c.x, c.y - 22, 'Pigeons scoffed it!', '#ff8f8f', 15); c.eaten = true; }
        }
        // little wander
        if (Math.random() < dt * 0.6) { b.gx = clamp(b.x + rand(-16, 16), 30, W - 30); b.gy = clamp(b.y + rand(-12, 12), TOP + 20, BOTTOM - 20); b.dir = b.gx < b.x ? -1 : 1; }
        b.x += (b.gx - b.x) * Math.min(1, dt * 3); b.y += (b.gy - b.y) * Math.min(1, dt * 3);
      } else {
        b.alertT -= dt;
        if (b.alertT <= 0) takeOff(b, true);
      }
    } else if (b.state === 'fly') {
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += 150 * dt;
      if (b.x < -60 || b.x > W + 60 || b.y - b.z < -80 || b.y > H + 60) b.gone = true;
    }
  }
  G.pigeons = G.pigeons.filter(b => !b.gone);

  // --- effects ---
  for (const q of G.puddles) q.life -= dt;
  G.puddles = G.puddles.filter(q => q.life > 0);
  for (const s of G.particles) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.96; s.vy = s.vy * 0.96 + (s.kind === 'dot' ? 0 : 60 * dt); s.life -= dt; s.rot += s.spin * dt; }
  G.particles = G.particles.filter(s => s.life > 0);
  for (const u of G.popups) { u.t += dt; u.y -= 34 * dt; }
  G.popups = G.popups.filter(u => u.t < 1.3);
  for (const r of G.rings) r.t += dt;
  G.rings = G.rings.filter(r => r.t < 0.45);
  for (const h of houses) h.flash = Math.max(0, h.flash - dt);
  G.shake = Math.max(0, G.shake - dt * 22);
}

function deliver(p) {
  p.state = 'leave'; p.hasLetter = false;
  p.tx = p.x < W / 2 ? -40 : W + 40; p.ty = clamp(p.y + (p.house.top ? 60 : -60), TOP + 30, BOTTOM - 30);
  p.house.flash = 1;
  G.letters++;
  G.score = Math.max(0, G.score - 25);
  sfx.letter();
  popup(p.house.box.x, p.house.box.y + (p.house.top ? 40 : -30), 'Letter delivered!', '#ff8f8f', 18);
  if (G.letters >= CFG.maxLetters) {
    G.mode = 'over'; G.overT = 0; sfx.over();
    G.newBest = G.score > best;
    if (G.newBest) { best = G.score; try { localStorage.setItem('motown-best', String(best)); } catch (e) { /* fine */ } }
  }
}

// ============================================================
//  DRAWING
// ============================================================
function ell(x, y, rx, ry, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 6.2832); ctx.fill();
}
function rrect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function label(text, x, y, size, colour, align = 'center', weight = 900, outline = '#1b1b1b') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline; ctx.strokeText(text, x, y); }
  ctx.fillStyle = colour; ctx.fillText(text, x, y);
}

// ----- the town backdrop is painted once on to an off-screen canvas -----
const backdrop = document.createElement('canvas'); backdrop.width = W; backdrop.height = H;
(function paintBackdrop() {
  const c = backdrop.getContext('2d');
  c.fillStyle = '#74c365'; c.fillRect(0, 0, W, H);
  // mown stripes
  for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.03)'; c.fillRect(i * 80, TOP, 80, BOTTOM - TOP); }
  // winding path
  c.strokeStyle = '#e6d3a3'; c.lineWidth = 38; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-20, 300); c.bezierCurveTo(220, 220, 380, 430, 560, 340); c.bezierCurveTo(700, 270, 820, 380, 980, 330); c.stroke();
  c.strokeStyle = '#f1e2ba'; c.lineWidth = 26; c.stroke();
  // pond
  c.fillStyle = '#4f9bd1'; c.beginPath(); c.ellipse(770, 455, 74, 36, -0.1, 0, 6.2832); c.fill();
  c.fillStyle = '#7fc0ea'; c.beginPath(); c.ellipse(752, 446, 34, 12, -0.1, 0, 6.2832); c.fill();
  // tufts and flowers
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 170; i++) {
    const x = r() * W, y = TOP + 14 + r() * (BOTTOM - TOP - 28);
    c.strokeStyle = 'rgba(40,110,45,.55)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y - 7); c.moveTo(x, y); c.lineTo(x + 3, y - 7); c.stroke();
  }
  for (let i = 0; i < 46; i++) {
    const x = r() * W, y = TOP + 16 + r() * (BOTTOM - TOP - 32), col = ['#fff', '#ffd23f', '#ff9ecb', '#c7a6ff'][Math.floor(r() * 4)];
    c.fillStyle = col; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.257) * 3.4, y + Math.sin(k * 1.257) * 3.4, 2.2, 0, 6.2832); c.fill(); }
    c.fillStyle = '#f5a300'; c.beginPath(); c.arc(x, y, 1.8, 0, 6.2832); c.fill();
  }
  // pavements and house plots
  c.fillStyle = '#c9c4b8'; c.fillRect(0, 0, W, TOP); c.fillRect(0, BOTTOM, W, H - BOTTOM);
  c.fillStyle = '#b3aea2';
  for (let x = 0; x < W; x += 48) { c.fillRect(x, TOP - 12, 2, 12); c.fillRect(x, BOTTOM, 2, 12); }
  c.fillStyle = '#9d988c'; c.fillRect(0, TOP - 2, W, 3); c.fillRect(0, BOTTOM - 1, W, 3);
  for (const h of houses) {
    const wallY = h.top ? 84 : 578, roofY = h.top ? 48 : 548, wallH = h.top ? 44 : 50;
    // garden
    c.fillStyle = '#8fd07f'; c.fillRect(h.cx - 84, roofY - 2, 168, (h.top ? TOP - 14 : H) - roofY + 2);
    // wall
    c.fillStyle = h.wall; c.fillRect(h.cx - 62, wallY, 124, wallH);
    c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(h.cx - 62, wallY, 124, 6);
    // roof
    c.fillStyle = h.roof; c.beginPath(); c.moveTo(h.cx - 74, wallY); c.lineTo(h.cx - 46, roofY); c.lineTo(h.cx + 46, roofY); c.lineTo(h.cx + 74, wallY); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(h.cx - 50, roofY + 8, 100, 3); c.fillRect(h.cx - 58, roofY + 19, 116, 3);
    // chimney
    c.fillStyle = '#8b5a44'; c.fillRect(h.cx + 24, roofY - 8, 14, 16);
    // door and windows
    c.fillStyle = '#5a3d2b'; c.beginPath(); c.roundRect(h.cx - 10, wallY + wallH - 30, 20, 30, [8, 8, 0, 0]); c.fill();
    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(h.cx + 5, wallY + wallH - 14, 1.8, 0, 6.2832); c.fill();
    for (const wx of [-42, 26]) {
      c.fillStyle = '#fff'; c.fillRect(h.cx + wx - 2, wallY + 10, 22, 22);
      c.fillStyle = '#9fd3f0'; c.fillRect(h.cx + wx, wallY + 12, 18, 18);
      c.fillStyle = '#fff'; c.fillRect(h.cx + wx + 8, wallY + 12, 2, 18); c.fillRect(h.cx + wx, wallY + 20, 18, 2);
    }
  }
})();

function drawLetterbox(h) {
  const { x, y } = h.box, f = h.flash;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, y + 12, 11, 4, 0, 0, 6.2832); ctx.fill();
  rrect(x - 3, y - 4, 6, 16, 2, '#4a4a4a');
  rrect(x - 11, y - 22, 22, 20, 6, f > 0 && Math.floor(f * 10) % 2 ? '#ff6b6b' : '#1f8a4c');
  rrect(x - 7, y - 15, 14, 3, 1.5, '#0c3d21');
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 5, y - 9, 10, 2);
}

function drawCheese(c) {
  const s = 0.55 + 0.45 * Math.min(1, c.hp / 5), pop = Math.min(1, (G.t - c.born) * 5);
  ctx.save(); ctx.translate(c.x, c.y + Math.sin(G.t * 3 + c.bob) * 2.5); ctx.scale(s * pop, s * pop);
  ell(0, 13, 17, 5, 'rgba(0,0,0,.2)');
  ctx.fillStyle = '#f5b700'; ctx.beginPath(); ctx.moveTo(-17, 9); ctx.lineTo(17, 9); ctx.lineTo(17, -3); ctx.lineTo(-17, 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-17, 2); ctx.lineTo(17, -3); ctx.lineTo(8, -13); ctx.closePath(); ctx.fill();
  ell(-5, 6, 2.8, 2.2, '#d99800'); ell(7, 4, 3.6, 2.8, '#d99800'); ell(12, 7, 1.8, 1.5, '#d99800'); ell(5, -6, 2.4, 1.6, '#f0c020');
  ctx.restore();
}

// Mo: black coat, white blaze and chest, rust eyebrows, cheeks and legs.
function drawMo(x, y, dir, phase, state, moving, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * scale, scale);
  const turbo = state === 'turbo', queasy = state === 'queasy';
  const bounce = moving ? Math.abs(Math.sin(phase)) * (turbo ? 5 : 3) : Math.sin(G.t * 3) * 1;
  ell(0, 26, 34, 8, 'rgba(0,0,0,.22)');
  ctx.translate(0, -bounce);
  // tail
  const wag = Math.sin(G.t * (turbo ? 30 : queasy ? 3 : 11)) * (queasy ? 0.1 : 0.4);
  ctx.save(); ctx.translate(-27, -4); ctx.rotate(-0.7 + wag + (queasy ? 1.3 : 0));
  ell(-13, 0, 15, 7, '#151515'); ell(-25, 0, 6, 5, '#fff'); ctx.restore();
  // legs
  const legs = [[-19, 1], [-9, -1], [11, 1], [21, -1]];
  legs.forEach(([lx, sgn], i) => {
    const sw = moving ? Math.sin(phase + i * 1.6) * 7 * sgn : 0;
    rrect(lx - 5 + sw * 0.5, 6, 10, 14, 4, '#151515');
    rrect(lx - 5 + sw, 14, 10, 9, 4, '#b5651d');
    rrect(lx - 5.5 + sw, 20, 12, 6, 3, '#fff');
  });
  // body
  ell(0, 0, 31, 20, '#151515');
  ell(-6, -7, 20, 9, '#262626');           // shine on the coat
  ell(22, 8, 9, 13, '#fff', -0.2);         // chest
  // head
  ctx.save(); ctx.translate(30, -15 + (queasy ? 5 : 0)); ctx.rotate(queasy ? 0.25 : turbo ? -0.12 : 0);
  ell(-9, 4, 8, 13, '#0b0b0b', 0.35);      // ear
  ell(0, 0, 17, 16, '#151515');
  ell(4, 9, 6, 5, '#b5651d');              // cheek
  ell(13, 6, 10, 8, '#fff');               // muzzle
  ell(7, -7, 3.2, 10, '#fff', 0.2);        // blaze
  ell(3, -9, 2.8, 2.2, '#b5651d');         // eyebrow
  if (queasy) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(6, -2); ctx.moveTo(6, -6); ctx.lineTo(1, -2); ctx.stroke(); }
  else { ell(3.5, -3.5, turbo ? 4 : 3, turbo ? 4 : 3, '#fff'); ell(4.3, -3.5, 1.9, 1.9, '#2a1708'); }
  ell(22, 3, 3.6, 3, '#111');              // nose
  if (!queasy) { ell(15, 14, 4, turbo || moving ? 7 : 4.5, '#ff7a93'); }
  else { ell(13, 9, 9, 6, 'rgba(120,200,90,.55)'); }
  ctx.restore();
  ctx.restore();
}

function drawPostman(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.state !== 'bowled') ell(0, 26, 15, 5, 'rgba(0,0,0,.22)');
  ctx.rotate(p.rot); ctx.scale(p.dir, 1);
  const walking = p.state === 'walk' || p.state === 'leave';
  const sw = walking ? Math.sin(p.phase) * 6 : 0;
  rrect(-8 + sw, 12, 7, 14, 3, '#1c2f57'); rrect(1 - sw, 12, 7, 14, 3, '#1c2f57');
  rrect(-9 + sw, 23, 10, 5, 2, '#111'); rrect(0 - sw, 23, 10, 5, 2, '#111');
  rrect(-11, -10, 22, 26, 7, '#2d5fc4');                 // jacket
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-1, -6, 2, 18); // buttons strip
  rrect(-17, 0, 13, 15, 3, '#c0392b');                   // post bag
  ctx.strokeStyle = '#8d2a20'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-12, 1); ctx.lineTo(8, -9); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-15, -3, 8, 5);
  if (p.hasLetter && p.state !== 'bowled') { rrect(10, -2 - sw * 0.3, 12, 8, 1, '#fff'); ctx.fillStyle = '#c0392b'; ctx.fillRect(18, -1 - sw * 0.3, 3, 3); }
  ell(0, -18, 9, 9, '#f2c9a0');                          // head
  ell(4, -18, 1.5, 1.8, '#222');
  if (p.state === 'stun' || p.state === 'bowled') { ell(5, -13, 2.6, 2.8, '#7a2e2e'); } else { ctx.fillStyle = '#7a2e2e'; ctx.fillRect(3, -14, 5, 1.6); }
  rrect(-10, -29, 19, 9, 4, '#1c2f57');                  // cap
  rrect(2, -23, 12, 3.5, 1.5, '#12203d');
  ctx.restore();
  if (p.state === 'stun') {
    for (let i = 0; i < 3; i++) {
      const a = G.t * 6 + i * 2.094;
      star(p.x + Math.cos(a) * 15, p.y - 36 + Math.sin(a) * 5, 5, '#ffd23f');
    }
  }
}
function star(x, y, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.6283 - 1.5708, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

function drawPigeon(b) {
  const flying = b.state === 'fly' || b.state === 'land';
  ell(b.x, b.y + 9, 9 - Math.min(5, b.z / 60), 3, `rgba(0,0,0,${Math.max(0.05, 0.2 - b.z / 1500)})`);
  ctx.save(); ctx.translate(b.x, b.y - b.z); ctx.scale(b.dir, 1);
  const peck = b.state === 'peck' ? Math.max(0, Math.sin(b.bob)) * 5 : 0;
  if (!flying) { ctx.strokeStyle = '#e8743b'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-2, 4); ctx.lineTo(-3, 9); ctx.moveTo(2, 4); ctx.lineTo(2, 9); ctx.stroke(); }
  ell(0, 0, 10, 6.5, '#8f99ad');
  ell(-9, -1, 5, 2.6, '#6b7385', 0.2);                   // tail
  if (flying) { const f = Math.sin(G.t * 34 + b.bob); ell(-1, -4 - f * 6, 8, 3.5, '#6b7385', -0.3 * f); ell(-1, 1 + f * 4, 7, 3, '#5d6577', 0.2 * f); }
  else ell(-2, 0, 6, 4, '#6b7385', 0.15);
  ell(7, -3 + peck * 0.6, 3.6, 3, '#4f9a6e');            // shimmery neck
  ell(9, -7 + peck, 4, 3.8, '#6b7385');
  ell(10.5, -8 + peck, 1.1, 1.1, b.state === 'alert' ? '#fff' : '#f39a2b');
  ctx.fillStyle = '#f0c040'; ctx.beginPath(); ctx.moveTo(12.5, -7 + peck); ctx.lineTo(17, -5.5 + peck); ctx.lineTo(12.5, -4.5 + peck); ctx.fill();
  ctx.restore();
  if (b.state === 'alert') label('!', b.x, b.y - 22, 15, '#fff');
}

function drawParticle(s) {
  ctx.globalAlpha = clamp(s.life / s.max * 1.6, 0, 1);
  if (s.kind === 'letter') {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = s.colour; ctx.fillRect(-6, -4, 12, 8); ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(0, 1); ctx.lineTo(6, -4); ctx.stroke(); ctx.restore();
  } else if (s.kind === 'feather') {
    ell(s.x, s.y, 5, 1.8, s.colour, s.rot);
  } else if (s.kind === 'star') {
    star(s.x, s.y, s.size + 2, s.colour);
  } else ell(s.x, s.y, s.size, s.size, s.colour);
  ctx.globalAlpha = 1;
}

// ----- heads-up display -----
function drawHUD() {
  const mo = G.mo;
  rrect(8, 6, W - 16, 36, 12, 'rgba(22,30,26,.86)');
  label('MO TOWN', 24, 25, 17, '#ffd23f', 'left', 900, null);
  label('Score ' + G.score, 132, 25, 17, '#fff', 'left', 800, null);
  label('Best ' + Math.max(best, G.score), 270, 25, 14, '#b9c7bd', 'left', 700, null);

  // gut-o-meter
  label('Gut-o-meter', 400, 25, 13, '#b9c7bd', 'left', 700, null);
  const gx = 486;
  if (mo.state === 'normal') {
    for (let i = 0; i < CFG.gutMax; i++) {
      rrect(gx + i * 30, 14, 26, 22, 6, i < mo.gut ? '#f5b700' : 'rgba(255,255,255,.12)');
      if (i < mo.gut) { ell(gx + i * 30 + 9, 22, 2.4, 2, '#c98f00'); ell(gx + i * 30 + 18, 28, 3, 2.4, '#c98f00'); }
    }
    if (mo.gut === CFG.gutMax - 1 && Math.floor(G.t * 4) % 2) label('one more...', gx + 160, 25, 12, '#ffd23f', 'left', 800, null);
  } else {
    const turbo = mo.state === 'turbo', frac = mo.stateT / (turbo ? CFG.turboTime : CFG.queasyTime);
    rrect(gx, 14, 146, 22, 6, 'rgba(255,255,255,.12)');
    rrect(gx, 14, Math.max(8, 146 * frac), 22, 6, turbo ? '#a0682e' : '#8dbb5a');
    label(turbo ? 'TURBO TROTS ×2' : 'Queasy...', gx + 73, 25, 12, '#fff', 'center', 800, null);
  }

  // letters delivered
  label('Letters', 738, 25, 13, '#b9c7bd', 'left', 700, null);
  for (let i = 0; i < CFG.maxLetters; i++) {
    const x = 796 + i * 30, on = i < G.letters;
    rrect(x, 15, 24, 18, 3, on ? '#ff6b6b' : 'rgba(255,255,255,.14)');
    ctx.strokeStyle = on ? '#8d2a20' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 1, 16); ctx.lineTo(x + 12, 25); ctx.lineTo(x + 23, 16); ctx.stroke();
  }
}

function drawSoundButton() {
  const { x, y, w, h } = SOUND_BTN, st = soundStatus();
  rrect(x, y, w, h, 15, st === 'blocked' ? 'rgba(150,60,30,.94)' : 'rgba(22,30,26,.9)');
  // speaker icon
  const ix = x + 20, iy = y + h / 2;
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(ix - 8, iy - 4); ctx.lineTo(ix - 3, iy - 4); ctx.lineTo(ix + 3, iy - 9); ctx.lineTo(ix + 3, iy + 9); ctx.lineTo(ix - 3, iy + 4); ctx.lineTo(ix - 8, iy + 4); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (st === 'on') {
    ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(ix + 4, iy, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(ix + 4, iy, 9.5, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.strokeStyle = st === 'off' ? '#ff6b6b' : '#ffd23f';
    ctx.beginPath(); ctx.moveTo(ix + 7, iy - 5); ctx.lineTo(ix + 15, iy + 5); ctx.moveTo(ix + 15, iy - 5); ctx.lineTo(ix + 7, iy + 5); ctx.stroke();
  }
  const text = st === 'on' ? 'Sound on  (M)' : st === 'off' ? 'Sound off  (M)' : 'Click for sound';
  label(text, x + 42, iy + 1, 13, st === 'off' ? '#ffb3b3' : '#fff', 'left', 800, null);
}

function drawWorld() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  ctx.drawImage(backdrop, 0, 0);

  for (const q of G.puddles) { ctx.globalAlpha = Math.min(1, q.life / 1.2) * 0.85; ell(q.x, q.y, q.r, q.r * 0.55, '#6b4119'); ell(q.x - 2, q.y - 1, q.r * 0.45, q.r * 0.22, '#8a5a28'); }
  ctx.globalAlpha = 1;
  for (const r of G.rings) {
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - r.t / 0.45)})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(r.x, r.y, CFG.barkRadius * (r.t / 0.45), 0, 6.2832); ctx.stroke();
  }
  for (const h of houses) drawLetterbox(h);

  // draw everything standing on the ground in depth order
  const things = [];
  for (const c of G.cheeses) things.push([c.y, () => drawCheese(c)]);
  for (const p of G.postmen) things.push([p.y, () => drawPostman(p)]);
  for (const b of G.pigeons) if (b.z < 20) things.push([b.y - 8, () => drawPigeon(b)]);
  const mo = G.mo;
  things.push([mo.y, () => {
    if (mo.immune > 0 && mo.dazed <= 0 && Math.floor(G.t * 16) % 2) ctx.globalAlpha = 0.5;
    drawMo(mo.x, mo.y, mo.dir, mo.phase, mo.state, mo.moving);
    ctx.globalAlpha = 1;
  }]);
  things.sort((a, b) => a[0] - b[0]).forEach(t => t[1]());
  for (const b of G.pigeons) if (b.z >= 20) drawPigeon(b);
  for (const s of G.particles) drawParticle(s);
  for (const u of G.popups) { ctx.globalAlpha = clamp((1.3 - u.t) * 2.5, 0, 1); label(u.text, clamp(u.x, 90, W - 90), u.y, u.size, u.colour); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (mo.state === 'turbo') { ctx.fillStyle = `rgba(255,190,60,${0.06 + Math.sin(G.t * 20) * 0.03})`; ctx.fillRect(0, 0, W, H); }
  if (mo.state === 'queasy') { ctx.fillStyle = 'rgba(110,170,70,.13)'; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

function panel(w, h) {
  ctx.fillStyle = 'rgba(16,24,20,.72)'; ctx.fillRect(0, 0, W, H);
  rrect((W - w) / 2, (H - h) / 2, w, h, 22, '#fdf6e3');
  ctx.strokeStyle = '#151515'; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect((W - w) / 2, (H - h) / 2, w, h, 22); ctx.stroke();
}

function drawTitle() {
  ctx.drawImage(backdrop, 0, 0);
  panel(720, 500);
  label('MO TOWN', W / 2, 128, 74, '#ffd23f', 'center', 900, '#151515');
  label('One Bernese. Too much cheese. No post today.', W / 2, 180, 18, '#4a3b2a', 'center', 700, null);
  drawMo(W / 2 - 8, 262, 1, G.t * 10, 'normal', true, 1.7);
  const rows = [
    touchMode ? ['Left thumb', 'Drag anywhere on the left to run about the park'] : ['Arrow keys / WASD', 'Run about the park'],
    touchMode ? ['Right thumb', 'Tap to bark: stuns postmen, then charge in to bowl them over'] : ['Space', 'Bark: stuns postmen, then charge in to bowl them over'],
    ['Cheese', 'Five wedges fill the Gut-o-meter → TURBO TROTS (fast, ×2 points)'],
    ['...then', 'A queasy tummy: slow and no barking. Time your cheese!'],
    ['Pigeons', 'Chase them off before they scoff your cheese'],
    ['Game over', 'when five letters get delivered'],
  ];
  rows.forEach(([k, v], i) => {
    label(k, 300, 338 + i * 27, 15, '#b5651d', 'right', 900, null);
    label(v, 316, 338 + i * 27, 15, '#2b2b2b', 'left', 600, null);
  });
  if (Math.floor(G.t * 2) % 2) label(touchMode ? 'Tap to play' : 'Press Enter or click to play', W / 2, 518, 22, '#fff', 'center', 900, '#151515');
  label(touchMode ? 'Best played with your phone sideways' : 'P pause · M mute (or the speaker button, bottom right)', W / 2, 550, 13, '#6b5b47', 'center', 700, null);
}

function drawOver() {
  drawWorld();
  panel(520, 380);
  label('POST DELIVERED', W / 2, 176, 44, '#ff6b6b', 'center', 900, '#151515');
  label('Mo is absolutely raging.', W / 2, 216, 17, '#4a3b2a', 'center', 700, null);
  label(String(G.score), W / 2, 272, 62, '#ffd23f', 'center', 900, '#151515');
  label(G.newBest ? 'New best score!' : 'Best ' + best, W / 2, 316, 17, G.newBest ? '#1f8a4c' : '#6b5b47', 'center', 800, null);
  const s = G.stats;
  const lines = [['Postmen bowled over', s.bowled], ['Pigeons chased', s.chased], ['Cheese scoffed', s.cheese], ['Turbo Trots', s.trots]];
  lines.forEach(([k, v], i) => {
    label(k, W / 2 + 40, 352 + i * 24, 15, '#2b2b2b', 'right', 600, null);
    label(String(v), W / 2 + 58, 352 + i * 24, 15, '#b5651d', 'left', 900, null);
  });
  if (G.overT > 0.8 && Math.floor(G.t * 2) % 2) label(touchMode ? 'Tap to go again' : 'Press Enter or click to go again', W / 2, 468, 20, '#fff', 'center', 900, '#151515');
}

// keeps the on-screen touch buttons in step with the game (only touches the page when something changes)
let uiState = '';
function syncTouchUI() {
  const playing = G.mode === 'play' && !G.paused, st = soundStatus();
  const canBark = playing && G.mo.state !== 'queasy';
  const state = playing + st + canBark;
  if (state === uiState) return;
  uiState = state;
  document.body.classList.toggle('playing', playing);
  document.getElementById('barkBtn').classList.toggle('off', !canBark);
  const m = document.getElementById('muteBtn');
  m.textContent = st === 'off' ? 'OFF' : 'SND';        // before the first tap sound is merely waiting, not off
  m.style.color = st === 'off' ? '#ff8f8f' : '#fff';
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (G.mode === 'title') { G.t += dt; drawTitle(); }
  else if (G.mode === 'play') {
    if (!G.paused) update(dt);
    drawWorld();
    if (G.paused) { ctx.fillStyle = 'rgba(16,24,20,.6)'; ctx.fillRect(0, 0, W, H); label('Paused', W / 2, H / 2, 48, '#fff'); label(touchMode ? 'Tap to carry on' : 'P to carry on', W / 2, H / 2 + 44, 16, '#fff'); }
  } else { G.t += dt; G.overT += dt; drawOver(); }
  if (touchMode) syncTouchUI(); else drawSoundButton();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
